[package]
name = "redact-paperasse-cli"
description = "CLI for redact-paperasse: redact PII from images, PDFs, and text"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "redactpapr"
path = "src/main.rs"

[features]
default = []
# Off by default so `cargo build`/`cargo install` for the plain CLI never
# pulls in reqwest — matches redact-paperasse-core's own tier-b feature
# being opt-in. Build with `--features tier-b` for the `--tier-b` flag.
tier-b = ["redact-paperasse-core/tier-b"]

[dependencies]
redact-paperasse-core = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }
