[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/recognizers",
    "crates/cli",
    "bindings/node",
    "bindings/python",
    "bindings/wasm",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/PaperasseAI/redact-paperasse"
version = "0.1.13"

[workspace.dependencies]
redact-paperasse-core = { path = "crates/core", version = "0.1.13" }
redact-paperasse-recognizers = { path = "crates/recognizers", version = "0.1.13" }
anydoc = "0.1.7"
# default-features = false here, not true: Cargo's workspace-inheritance
# only allows a member to override `default-features` DOWNWARD (off) if the
# workspace baseline is already off — a member can't turn a workspace-true
# default back off. So the baseline excludes liteparse's only default
# feature (`tesseract`, a native CMake C++ build of Tesseract+Leptonica
# that doesn't target wasm32), and crates/core's non-wasm32 target adds it
# back explicitly via `features = ["tesseract"]` (see that Cargo.toml).
liteparse = { version = "2.11.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
lto = "thin"
strip = "symbols"
