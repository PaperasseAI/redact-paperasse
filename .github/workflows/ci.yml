name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # liteparse's default `tesseract` feature builds Tesseract + Leptonica
      # from source via CMake — see crates/core/Cargo.toml's comment on why
      # that dependency exists at all, and this repo's README "Build
      # status" section for how that was discovered.
      - name: Install native build dependencies (Tesseract/Leptonica via CMake)
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      # This must be the FIRST cargo command that touches the lockfile.
      # Any *unlocked* cargo invocation silently rewrites Cargo.lock on
      # disk, so a --locked check placed after one is checking a file the
      # earlier step already repaired -- it can never fail. That is exactly
      # how a stale lock reached the v0.1.6 tag and broke `cargo publish`,
      # which does run --locked first and had nothing to repair it.
      - name: Check Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check the tier-b feature builds standalone
        run: cargo check -p redact-paperasse-cli --features tier-b --locked

  wasm:
    name: Rust (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown
      # No cmake/OCR toolchain needed here: crates/core/Cargo.toml's
      # target-specific liteparse dependency disables the `tesseract`
      # feature under wasm32 (see that file's comment) — pixel-level PDF
      # redaction is unavailable on this target regardless (liteparse's
      # own screenshot_input doesn't exist for wasm32), so the wasm binding
      # only exposes Tier A text redaction.
      - run: cargo clippy -p redact-paperasse-wasm --target wasm32-unknown-unknown -- -D warnings

  license-check:
    name: Dependency license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-license
      # See NOTICE.md for the full audit and rationale. This is a
      # regression guard, not the audit itself: it fails if a future
      # dependency bump ever pulls in a strong-copyleft-licensed crate,
      # which would be incompatible with this project's MIT license.
      # LGPL is deliberately NOT flagged: r-efi offers it only as one
      # option in an Apache-2.0/LGPL-2.1/MIT choice, which Cargo resolves
      # under Apache-2.0/MIT — see NOTICE.md.
      - name: Fail if any dependency license contains GPL/AGPL/SSPL
        run: |
          cargo license --all-features > license-report.txt
          cat license-report.txt
          if grep -Ei '\b(A?GPL)-|\bSSPL-' license-report.txt; then
            echo "::error::A dependency license looks copyleft-incompatible with MIT — see NOTICE.md and update it if this is a real, acceptable addition."
            exit 1
          fi

  node:
    name: Node binding (build + real example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies (Tesseract/Leptonica via CMake)
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: bindings/node
      - run: npx napi build --platform
        working-directory: bindings/node
      # liteparse-pdfium loads PDFium at runtime via dlopen with no
      # link-time dependency at all, so a Swatinem/rust-cache hit can mean
      # liteparse-pdfium-sys's build script (the only thing that downloads
      # it) never re-runs, even though the cached .rlib satisfies the
      # compiler fine — leaving no pdfium binary anywhere on the runner.
      # Hit this for real: example.mjs's redactImage call panicked with
      # "could not find pdfium shared library" on a cache-hit run. Same
      # fix as publish.yml's identical problem: download the release
      # directly rather than depend on build.rs having fetched it this
      # session, then bundle it next to the compiled .node (the crate's
      # own runtime search order already checks "next to the native
      # extension module" via dladdr).
      - name: Download the pdfium shared library directly
        working-directory: bindings/node
        run: |
          set -euo pipefail
          curl -sL --fail -o pdfium.tgz "https://github.com/run-llama/pdfium-binaries/releases/download/chromium%2F7897/pdfium-linux-x64.tgz"
          mkdir -p pdfium-extract
          tar -xzf pdfium.tgz -C pdfium-extract
          cp pdfium-extract/lib/libpdfium.so .
      - name: Run the real example against the built native addon
        run: node example.mjs
        working-directory: bindings/node
