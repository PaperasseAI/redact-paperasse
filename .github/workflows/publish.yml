name: Publish

# Triggered by pushing a `vX.Y.Z` tag, or manually via workflow_dispatch for
# a dry run of the build matrix (publish steps still require the tag push —
# `npm publish`/`maturin upload`/`cargo publish` all read the version out of
# the already-committed Cargo.toml/package.json/pyproject.toml, this
# workflow doesn't bump versions itself).
#
# Requires three repo secrets:
#   CARGO_REGISTRY_TOKEN — crates.io API token. Not needed urgently: the
#     three publishable crates (recognizers/core/cli) are already live on
#     crates.io v0.1.0, published manually in the same dependency order
#     this job uses. Configure this before the next version bump.
#   NPM_TOKEN — npm automation token. Not yet configured — this is what's
#     blocking an actual npm release right now.
#   PYPI_API_TOKEN — PyPI API token (or switch to trusted publishing). Not
#     yet configured.
#
# Unlike ci.yml, this pipeline hasn't been exercised end to end (no tag has
# been pushed) — it's built from napi-rs's and maturin's own documented CI
# patterns. What's been verified locally, outside this workflow: the
# darwin-arm64 native addon builds in release mode, lands correctly in
# npm/darwin-arm64/, and loads with the right exports (redactText/
# redactImage/redactPdf). NOT verified: the other four platforms (need
# their own OS/toolchain — that's the whole reason this is a CI matrix, not
# a local build), the linux-arm64-gnu zig cross-compile step specifically,
# `napi artifacts`' recursive-crawl artifact placement across a real
# multi-job download, and the Linux PyPI wheel's manylinux-container
# cmake/tesseract install hook. Treat all of that as unverified until a
# real tagged release actually runs it.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies (Tesseract/Leptonica via CMake)
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      # Published in dependency order (recognizers has no internal deps,
      # core depends on it, cli depends on core). A short sleep after each
      # publish gives crates.io's index time to catch up before the next
      # crate's `cargo publish` tries to resolve it as a registry dep
      # rather than a path dep.
      - run: cargo publish -p redact-paperasse-recognizers --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30
      - run: cargo publish -p redact-paperasse-core --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30
      - run: cargo publish -p redact-paperasse-cli --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm-build:
    name: Build native addon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            # No native aarch64 Linux runner in the free tier — cross-compile
            # from x64 using napi-rs's own zig-based cross toolchain instead
            # of a separate arm64 runner or a docker cross image.
            zig: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config
      - uses: goto-bus-stop/setup-zig@v2
        if: matrix.zig
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: bindings/node
      - run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.zig && '--zig' || '' }}
        working-directory: bindings/node
      # `napi artifacts` (run in npm-publish) crawls this directory
      # recursively for files named `<binaryName>.<platformArchABI>.node` --
      # it doesn't care about the folder structure the artifacts land in,
      # only the filename `napi build` already produces, so a flat upload
      # here is enough.
      - uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.target }}
          path: bindings/node/*.node

  npm-publish:
    name: Publish npm package
    needs: npm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: napi-*
          path: bindings/node/artifacts
      - run: npm install
        working-directory: bindings/node
      # Sorts every downloaded .node file into its matching npm/<platform>/
      # directory (scaffolded by `napi create-npm-dir`, committed to the
      # repo) based on the filename `napi build` already produces --
      # untested end to end since no tag has triggered this yet.
      - run: npx napi artifacts
        working-directory: bindings/node
      # Each platform subpackage publishes independently (order doesn't
      # matter between them, unlike crates.io's dependency chain), then the
      # root package last, since its optionalDependencies reference them by
      # the version being published now.
      - name: Publish every platform subpackage
        working-directory: bindings/node
        run: |
          for dir in npm/*/; do
            echo "Publishing $(basename "$dir")"
            npm publish "$dir" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi-build:
    name: Build Python wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist
          # The Linux build runs inside a manylinux container, where the
          # host's apt-get above doesn't apply — liteparse's `tesseract`
          # feature needs cmake/pkg-config installed inside that container
          # instead. Untested: this is the standard maturin-action hook for
          # this situation, but no wheel has actually been built with it yet.
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum install -y cmake pkgconfig
            elif command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y cmake pkg-config
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: bindings/python/dist

  pypi-publish:
    name: Publish to PyPI
    needs: pypi-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
