name: Publish

# Triggered by pushing a `vX.Y.Z` tag, or manually via workflow_dispatch for
# a dry run of the build matrix (publish steps still require the tag push —
# `npm publish`/`maturin upload`/`cargo publish` all read the version out of
# the already-committed Cargo.toml/package.json/pyproject.toml, this
# workflow doesn't bump versions itself).
#
# Requires three repo secrets, all configured as of the v0.1.0 attempt below:
#   CARGO_REGISTRY_TOKEN — crates.io API token. Not needed urgently: the
#     three publishable crates (recognizers/core/cli) are already live on
#     crates.io v0.1.0, published manually in the same dependency order
#     this job uses — expect this job to fail on any tag re-pushing that
#     same version (crates.io rejects re-publishing an existing version),
#     harmlessly, since it doesn't gate npm-publish/pypi-publish.
#   NPM_TOKEN / PYPI_API_TOKEN — configured.
#
# Real v0.1.0 tag run (2026-08-10) found and fixed three genuine bugs this
# had never been exercised against before:
#   1. linux-arm64-gnu's zig cross-compile couldn't find OpenSSL headers
#      for the target arch (openssl-sys, pulled in transitively) — fixed by
#      switching to a native ubuntu-24.04-arm runner instead of
#      cross-compiling from x64.
#   2. macOS's runner defaults to Python 3.14, newer than PyO3 0.23's
#      known-version list (caps at 3.13) — fixed with the abi3-py39
#      feature (bindings/python/Cargo.toml) + PYO3_USE_ABI3_FORWARD_COMPATIBILITY.
#   3. The Linux PyPI wheel's before-script-linux ran apt-get as a non-root
#      user and hit a lock-file permission error — fixed by adding sudo.
# Also found, not a bug: macos-13 (Intel) sat queued for over an hour with
# zero GitHub-side runner availability, which would have hung the whole
# release indefinitely under the original all-or-nothing `needs:` gating —
# npm-publish/pypi-publish now run with `if: ${{ !cancelled() }}` and skip
# any platform that didn't produce a binary, so one stuck/slow runner
# degrades to "that platform ships next release" instead of blocking
# everything. Each matrix leg also now has a 45m timeout so a stuck runner
# fails (and gets skipped) instead of hanging.
#
# What actually built successfully in that same run: darwin-arm64 and
# x86_64-unknown-linux-gnu native addons, the win32-x64-msvc native addon,
# and the win32-x64-msvc Python wheel. What's still unverified after these
# fixes: the native ubuntu-24.04-arm build, the abi3 fix, the sudo fix, and
# npm-publish/pypi-publish's actual publish steps (napi artifacts'
# multi-job artifact placement, the per-platform subpackage publish loop)
# — none of those have run for real yet, only reasoned through from the
# failure logs above.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies (Tesseract/Leptonica via CMake)
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      # Published in dependency order (recognizers has no internal deps,
      # core depends on it, cli depends on core). A short sleep after each
      # publish gives crates.io's index time to catch up before the next
      # crate's `cargo publish` tries to resolve it as a registry dep
      # rather than a path dep.
      - run: cargo publish -p redact-paperasse-recognizers --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30
      - run: cargo publish -p redact-paperasse-core --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30
      - run: cargo publish -p redact-paperasse-cli --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm-build:
    name: Build native addon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native arm64 Linux runner (GitHub added these to the free tier
          # for public repos) instead of cross-compiling from x64. A zig
          # cross-compile was tried first and failed: openssl-sys couldn't
          # find OpenSSL headers for the target arch through the zig-cc
          # wrapper. Building natively sidesteps that whole problem class.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    # A stuck/queued runner (seen for real on macos-13, which has a much
    # smaller pool than macos-latest) shouldn't hang the whole release
    # indefinitely -- fail this leg after 45m so npm-publish (which
    # tolerates a missing platform, see its own comment below) can still
    # ship the platforms that did build.
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: bindings/node
      - run: npx napi build --platform --release --target ${{ matrix.target }}
        working-directory: bindings/node
      # `napi artifacts` (run in npm-publish) crawls this directory
      # recursively for files named `<binaryName>.<platformArchABI>.node` --
      # it doesn't care about the folder structure the artifacts land in,
      # only the filename `napi build` already produces, so a flat upload
      # here is enough.
      - uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.target }}
          path: bindings/node/*.node

  npm-publish:
    name: Publish npm package
    needs: npm-build
    # Publish whatever platforms actually built rather than requiring 100%
    # of the matrix to succeed -- a single stuck/failed leg (a real thing:
    # macos-13 sat queued for over an hour on the first real release
    # attempt) shouldn't block shipping the platforms that did build. The
    # per-platform "does this .node file actually exist" check below is
    # what keeps this safe: a missing platform is skipped, not published
    # broken.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: napi-*
          path: bindings/node/artifacts
      - run: npm install
        working-directory: bindings/node
      # Sorts every downloaded .node file into its matching npm/<platform>/
      # directory (scaffolded by `napi create-npm-dir`, committed to the
      # repo) based on the filename `napi build` already produces --
      # untested end to end since no tag has triggered this yet.
      - run: npx napi artifacts
        working-directory: bindings/node
      # Each platform subpackage publishes independently (order doesn't
      # matter between them, unlike crates.io's dependency chain), then the
      # root package last, since its optionalDependencies reference them by
      # the version being published now. Skips any npm/<platform>/ that has
      # no .node file in it -- that platform's npm-build leg didn't
      # succeed/finish, and optionalDependencies means npm silently omits
      # it on install rather than erroring, same as any other platform this
      # release simply doesn't ship yet.
      - name: Publish every platform subpackage that actually has a binary
        working-directory: bindings/node
        run: |
          for dir in npm/*/; do
            if ls "$dir"*.node >/dev/null 2>&1; then
              echo "Publishing $(basename "$dir")"
              npm publish "$dir" --access public
            else
              echo "Skipping $(basename "$dir") -- no .node binary present (its npm-build leg didn't produce one)"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi-build:
    name: Build Python wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist
          # The Linux build runs in a container where the host's apt-get
          # above doesn't apply, and (found on the first real release
          # attempt) executes as a non-root user -- apt-get needs sudo or
          # it fails with "Permission denied" on the lock file. yum's
          # branch is unverified but manylinux's yum-based images have
          # historically run as root, so it's left without sudo for now.
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum install -y cmake pkgconfig
            elif command -v apt-get &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y cmake pkg-config
            fi
        env:
          # The runner's default Python is newer than PyO3 0.23's known-
          # supported list (hit this for real: macOS shipped Python 3.14,
          # PyO3 caps at 3.13) -- pairs with the abi3-py39 feature in
          # bindings/python/Cargo.toml so this is safe rather than papering
          # over a genuine incompatibility: abi3 targets a stable C API
          # subset that doesn't change across newer CPython versions.
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: bindings/python/dist

  pypi-publish:
    name: Publish to PyPI
    needs: pypi-build
    # Same reasoning as npm-publish: publish whatever wheels actually
    # built rather than requiring every matrix leg to succeed.
    # --skip-existing below (already present) means a missing platform
    # here just means that wheel isn't on PyPI yet, not a hard failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
