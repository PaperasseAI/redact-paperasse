name: Publish

# Triggered by pushing a `vX.Y.Z` tag, or manually via workflow_dispatch for
# a dry run of the build matrix (publish steps still require the tag push —
# `npm publish`/`maturin upload`/`cargo publish` all read the version out of
# the already-committed Cargo.toml/package.json/pyproject.toml, this
# workflow doesn't bump versions itself).
#
# Requires three repo secrets — CARGO_REGISTRY_TOKEN, NPM_TOKEN,
# PYPI_API_TOKEN — all configured.
#
# Release history (abbreviated -- see git log for the full blow-by-blow):
#
# v0.1.0: real tag-push and workflow_dispatch runs found and fixed real CI
# bugs no amount of local testing could have caught -- linux-arm64-gnu's
# zig cross-compile couldn't find OpenSSL headers (fixed: native
# ubuntu-24.04-arm runner instead of cross-compiling); macOS's runner
# defaults to a Python newer than PyO3's known-version list (fixed:
# abi3-py39 + PYO3_USE_ABI3_FORWARD_COMPATIBILITY); the Linux PyPI wheel's
# before-script-linux ran apt-get as non-root (fixed: sudo); macos-13
# (Intel) sat queued for over an hour with zero runner availability, not a
# workflow bug (mitigated: npm-publish/pypi-publish run with
# `if: ${{ !cancelled() }}` and skip any platform that didn't build, so a
# stuck runner degrades to "ships next release" instead of blocking
# everything; each matrix leg has a 45m timeout for the same reason).
# PyPI published for real and was verified independently (installed from
# PyPI into a fresh venv). npm never got as far as npm-publish.
#
# v0.1.1: fixes a real, more serious bug surfaced by that PyPI
# verification -- redact_image/redact_pdf panicked with "could not find
# pdfium shared library" on every machine except the one that built the
# wheel. liteparse-pdfium loads PDFium at runtime via dlopen, invisible to
# maturin's/napi's automatic shared-library bundling, so the compiled
# extension shipped without its own runtime dependency. The real tag-push
# run for this fix then hit its own bug: every attempt to *find* a pdfium
# binary build.rs supposedly produced that session failed on npm-build,
# even after three different fallback strategies. Diagnostics revealed why
# no amount of searching would ever work: with a Swatinem/rust-cache hit,
# cargo's fingerprint check can skip rebuilding liteparse-pdfium-sys
# entirely (its compiled .rlib satisfies the compiler fine, since pdfium
# has no link-time dependency at all -- only a runtime dlopen one), so its
# build script -- the only thing that downloads pdfium -- never runs, and
# no pdfium binary exists anywhere on the filesystem that session, full
# stop. Fixed by not depending on build.rs having run at all: both
# npm-build and pypi-build now download the exact same pdfium release
# directly (same URL/tag/asset-naming build.rs itself uses -- see
# liteparse-pdfium-sys's build.rs for the reference), then bundle it next
# to the compiled extension, which the crate's own runtime search order
# already checks for (self_dir() via dladdr/GetModuleHandleExW). The
# bundling mechanism itself (as opposed to the CI step that feeds it a
# file) was verified for real on this machine for both bindings: hid the
# local pdfium cache dir to simulate a foreign machine, confirmed
# redact_image (Python, patched wheel in a fresh venv) and redactImage
# (Node, isolated directory) both fail without the bundled library and
# succeed with it. crates.io and PyPI both fully succeeded on the real
# v0.1.1 tag run before any of this was needed; npm is what required all
# of the above.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies (Tesseract/Leptonica via CMake)
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      # Published in dependency order (recognizers has no internal deps,
      # core depends on it, cli depends on core). A short sleep after each
      # publish gives crates.io's index time to catch up before the next
      # crate's `cargo publish` tries to resolve it as a registry dep
      # rather than a path dep.
      - run: cargo publish -p redact-paperasse-recognizers --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30
      - run: cargo publish -p redact-paperasse-core --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30
      - run: cargo publish -p redact-paperasse-cli --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm-build:
    name: Build native addon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-apple-darwin (macos-13) is temporarily OUT of the matrix,
          # to be added back later. GitHub's Intel-Mac runner pool starved
          # four consecutive releases: the leg sat *queued* — never started —
          # for over an hour each time, and timeout-minutes bounds execution,
          # not queue wait, so it never self-resolved and npm-publish never
          # ran. Everything needed to restore it is still here: the npm/
          # darwin-x64 subpackage, its optionalDependencies entry, and the
          # pdfium asset mapping. Re-add the `- os: macos-13 / target:
          # x86_64-apple-darwin` pair below when that pool is healthy.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native arm64 Linux runner (GitHub added these to the free tier
          # for public repos) instead of cross-compiling from x64. A zig
          # cross-compile was tried first and failed: openssl-sys couldn't
          # find OpenSSL headers for the target arch through the zig-cc
          # wrapper. Building natively sidesteps that whole problem class.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    # A stuck/queued runner (seen for real on macos-13, which has a much
    # smaller pool than macos-latest) shouldn't hang the whole release
    # indefinitely -- fail this leg after 45m so npm-publish (which
    # tolerates a missing platform, see its own comment below) can still
    # ship the platforms that did build.
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: bindings/node
      - run: npx napi build --platform --release --target ${{ matrix.target }}
        working-directory: bindings/node
      # liteparse-pdfium loads PDFium at runtime via dlopen, not at link
      # time, so it's invisible to napi's/maturin's automatic shared-library
      # bundling. Found by actually installing the published v0.1.0 wheel
      # from PyPI into a fresh venv and running it -- redactImage/redactPdf
      # panicked with "could not find pdfium shared library" on every
      # machine except the one that built it, since the crate's own
      # search_paths() baked-in fallback points at the CI runner's ephemeral
      # cache dir. Its search order also checks "next to the native
      # extension module" (self_dir() via dladdr/GetModuleHandleExW,
      # explicitly documented to cover .node files, not just Python's
      # .so/.pyd) -- copying the library there is the whole fix, verified
      # locally by hiding this machine's pdfium cache dir to simulate a
      # foreign machine and confirming redactImage fails without the
      # bundled copy and succeeds with it.
      # Three straight guesses at *finding* a pdfium binary build.rs
      # supposedly produced this session all failed on real CI runs (see
      # this workflow's git history for each) -- diagnostics on the third
      # attempt revealed why no amount of searching would ever have worked:
      # target/ had liteparse-pdfium-sys's compiled .rlib/.rmeta (from
      # Swatinem/rust-cache restoring a warm cache) but NO pdfium binary
      # anywhere on the filesystem at all. Runtime pdfium loading has no
      # link-time dependency (it's dlopen'd, see liteparse-pdfium-sys's own
      # build.rs), so a cache-hit crate satisfies the compiler fully
      # without its build script ever re-running -- meaning the download
      # step that would populate deps/ or the cache dir simply never
      # executes. Fix: stop depending on build.rs having run at all this
      # session. Download the exact same release directly -- same URL,
      # same tag, same asset naming build.rs itself uses -- independent of
      # any cargo/cache state.
      - name: Download the pdfium shared library directly
        id: pdfium
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-apple-darwin) asset=pdfium-mac-x64; name=libpdfium.dylib; subdir=lib ;;
            aarch64-apple-darwin) asset=pdfium-mac-arm64; name=libpdfium.dylib; subdir=lib ;;
            x86_64-unknown-linux-gnu) asset=pdfium-linux-x64; name=libpdfium.so; subdir=lib ;;
            aarch64-unknown-linux-gnu) asset=pdfium-linux-arm64; name=libpdfium.so; subdir=lib ;;
            x86_64-pc-windows-msvc) asset=pdfium-win-x64; name=pdfium.dll; subdir=bin ;;
          esac
          curl -sL --fail -o pdfium.tgz "https://github.com/run-llama/pdfium-binaries/releases/download/chromium%2F7897/${asset}.tgz"
          mkdir -p pdfium-extract
          tar -xzf pdfium.tgz -C pdfium-extract
          cp "pdfium-extract/${subdir}/${name}" "bindings/node/${name}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # `napi artifacts` (run in npm-publish) only picks up files named
      # `<binaryName>.<platformArchABI>.node` from this artifact; the
      # pdfium library alongside it is placed into the right npm/<platform>/
      # directory by a separate step there, matched by this artifact's name
      # rather than by filename (every darwin target's pdfium file is
      # literally named the same thing, so filename alone can't route it).
      - uses: actions/upload-artifact@v7
        with:
          name: napi-${{ matrix.target }}
          path: |
            bindings/node/*.node
            bindings/node/${{ steps.pdfium.outputs.name }}

  npm-publish:
    name: Publish npm package
    needs: npm-build
    # Publish whatever platforms actually built rather than requiring 100%
    # of the matrix to succeed -- a single stuck/failed leg (a real thing:
    # macos-13 sat queued for over an hour on the first real release
    # attempt) shouldn't block shipping the platforms that did build. The
    # per-platform "does this .node file actually exist" check below is
    # what keeps this safe: a missing platform is skipped, not published
    # broken.
    if: ${{ !cancelled() }}
    # `npm publish --provenance` signs the package against this workflow run
    # via OIDC, which needs id-token: write. The repo-wide default is
    # contents: read, so without this the platform subpackages publish fine
    # (they don't use --provenance) and then the ROOT package fails with
    # "Provenance generation in GitHub Actions requires write access to the
    # id-token permission" -- exactly what happened on the first run that got
    # this far, leaving 3 subpackages on npm and no root package.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: napi-*
          path: bindings/node/artifacts
      - run: npm install
        working-directory: bindings/node
      # Sorts every downloaded .node file into its matching npm/<platform>/
      # directory (scaffolded by `napi create-npm-dir`, committed to the
      # repo) based on the filename `napi build` already produces --
      # untested end to end since no tag has triggered this yet.
      - run: npx napi artifacts
        working-directory: bindings/node
      # napi artifacts (above) only knows about *.node files -- place each
      # downloaded pdfium library into its matching npm/<platformArchABI>/
      # directory too (see npm-build's comment for why this needs to exist
      # at all). Routed by the artifact directory name (a Rust target
      # triple, e.g. "napi-aarch64-apple-darwin") rather than the pdfium
      # filename, since every darwin target's file is literally named the
      # same thing.
      - name: Place each pdfium library next to its platform's .node file
        working-directory: bindings/node
        run: |
          declare -A triple_to_platform=(
            [x86_64-apple-darwin]=darwin-x64
            [aarch64-apple-darwin]=darwin-arm64
            [x86_64-unknown-linux-gnu]=linux-x64-gnu
            [aarch64-unknown-linux-gnu]=linux-arm64-gnu
            [x86_64-pc-windows-msvc]=win32-x64-msvc
          )
          for artifact_dir in artifacts/napi-*/; do
            triple=$(basename "$artifact_dir" | sed 's/^napi-//')
            platform="${triple_to_platform[$triple]}"
            if [ -z "$platform" ]; then
              echo "::error::unknown target triple in artifact dir: $triple"
              exit 1
            fi
            pdfium_file=$(find "$artifact_dir" -iname "libpdfium.*" -o -iname "pdfium.dll" | head -1)
            if [ -z "$pdfium_file" ]; then
              echo "no pdfium library found for $triple (its npm-build leg likely didn't produce one) -- skipping"
              continue
            fi
            if [ ! -d "npm/$platform" ]; then
              echo "::error::npm/$platform does not exist -- triple_to_platform mapping is out of sync with npm/*/"
              exit 1
            fi
            cp "$pdfium_file" "npm/$platform/"
            echo "placed $(basename "$pdfium_file") into npm/$platform/"
          done
      # Each platform subpackage publishes independently (order doesn't
      # matter between them, unlike crates.io's dependency chain), then the
      # root package last, since its optionalDependencies reference them by
      # the version being published now. Skips any npm/<platform>/ that has
      # no .node file in it -- that platform's npm-build leg didn't
      # succeed/finish, and optionalDependencies means npm silently omits
      # it on install rather than erroring, same as any other platform this
      # release simply doesn't ship yet.
      - name: Publish every platform subpackage that actually has a binary
        working-directory: bindings/node
        run: |
          # Idempotent on purpose. When one platform's build flakes, the fix
          # is to re-run the failed jobs -- but that replays this whole loop,
          # and npm answers 403 for a version already published, failing the
          # job even though it just did exactly what was needed. That happened
          # on v0.1.9: the macOS package published correctly on the re-run and
          # the job still went red on the next package in the loop, which
          # makes a green/red signal useless for telling whether the registry
          # is actually complete.
          VERSION=$(node -pe "require('./package.json').version")
          for dir in npm/*/; do
            name=$(node -pe "require('./$dir/package.json').name")
            if ! ls "$dir"*.node >/dev/null 2>&1; then
              echo "Skipping $name -- no .node binary present (its npm-build leg didn't produce one)"
            elif npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "Skipping $name -- $VERSION is already on the registry"
            else
              echo "Publishing $name@$VERSION"
              npm publish "$dir" --access public
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish the root package
        working-directory: bindings/node
        run: |
          VERSION=$(node -pe "require('./package.json').version")
          if npm view "redact-paperasse@$VERSION" version >/dev/null 2>&1; then
            echo "redact-paperasse@$VERSION is already published -- nothing to do"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi-build:
    name: Build Python wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist
          # The Linux build runs in a container where the host's apt-get
          # above doesn't apply, and (found on the first real release
          # attempt) executes as a non-root user -- apt-get needs sudo or
          # it fails with "Permission denied" on the lock file. yum's
          # branch is unverified but manylinux's yum-based images have
          # historically run as root, so it's left without sudo for now.
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum install -y cmake pkgconfig
            elif command -v apt-get &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y cmake pkg-config
            fi
        env:
          # The runner's default Python is newer than PyO3 0.23's known-
          # supported list (hit this for real: macOS shipped Python 3.14,
          # PyO3 caps at 3.13) -- pairs with the abi3-py39 feature in
          # bindings/python/Cargo.toml so this is safe rather than papering
          # over a genuine incompatibility: abi3 targets a stable C API
          # subset that doesn't change across newer CPython versions.
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      # liteparse-pdfium loads PDFium at runtime via dlopen, not at link
      # time, so it's invisible to maturin's automatic shared-library
      # bundling (which only sees link-time deps via otool/ldd). Found by
      # actually installing the published v0.1.0 wheel from PyPI into a
      # fresh venv and running it: redactImage/redactPdf panicked with
      # "could not find pdfium shared library" everywhere except the
      # machine that built it. The crate's own search order includes "next
      # to the native extension module" (dladdr-based), which
      # scripts/bundle_pdfium_into_wheel.py exploits by copying the library
      # in next to the compiled .so inside the wheel and updating RECORD's
      # hash/size entry to match -- verified for real: patched a locally
      # built wheel this exact way, installed it in a fresh venv, and
      # confirmed redact_image/redact_pdf work.
      #
      # Downloads the library directly rather than hunting for whatever
      # build.rs may or may not have produced this session -- see
      # npm-build's identical step for why "find whatever build.rs made"
      # doesn't work reliably (a Swatinem/rust-cache hit can mean build.rs
      # never re-runs at all, downloading nothing). This step runs on the
      # host runner, not inside maturin-action's manylinux container, so
      # it's unaffected by the container's own $HOME/filesystem either way.
      - name: Download the pdfium shared library directly
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-apple-darwin) asset=pdfium-mac-x64; name=libpdfium.dylib; subdir=lib ;;
            aarch64-apple-darwin) asset=pdfium-mac-arm64; name=libpdfium.dylib; subdir=lib ;;
            x86_64-unknown-linux-gnu) asset=pdfium-linux-x64; name=libpdfium.so; subdir=lib ;;
            aarch64-unknown-linux-gnu) asset=pdfium-linux-arm64; name=libpdfium.so; subdir=lib ;;
            x86_64-pc-windows-msvc) asset=pdfium-win-x64; name=pdfium.dll; subdir=bin ;;
          esac
          curl -sL --fail -o pdfium.tgz "https://github.com/run-llama/pdfium-binaries/releases/download/chromium%2F7897/${asset}.tgz"
          mkdir -p pdfium-extract
          tar -xzf pdfium.tgz -C pdfium-extract
          wheel_path=$(find bindings/python/dist -name "*.whl")
          command -v python3 >/dev/null 2>&1 && PY=python3 || PY=python
          "$PY" scripts/bundle_pdfium_into_wheel.py "$wheel_path" "pdfium-extract/${subdir}/${name}" redact_paperasse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: bindings/python/dist

  pypi-publish:
    name: Publish to PyPI
    needs: pypi-build
    # Same reasoning as npm-publish: publish whatever wheels actually
    # built rather than requiring every matrix leg to succeed.
    # --skip-existing below (already present) means a missing platform
    # here just means that wheel isn't on PyPI yet, not a hard failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
