[package]
name = "redact-paperasse-node"
description = "Node.js bindings for redact-paperasse"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
# Consumed via napi's own npm packaging (see bindings/node/package.json),
# not crates.io — this crate-type is cdylib-only and meaningless as a Rust
# library dependency.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
redact-paperasse-core = { workspace = true }
napi = { version = "2", default-features = false, features = ["napi4", "async"] }
napi-derive = "2"
tokio = { workspace = true, features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2"
