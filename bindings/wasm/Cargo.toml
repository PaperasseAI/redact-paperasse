[package]
name = "paperasse-privacy-wasm"
description = "Browser (WebAssembly) bindings for paperasse-privacy"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
paperasse-privacy-core = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[features]
default = ["console_error_panic_hook"]
