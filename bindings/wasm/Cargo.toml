[package]
name = "redact-paperasse-wasm"
description = "Browser (WebAssembly) bindings for redact-paperasse"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
# Consumed via wasm-pack/wasm-bindgen's own npm packaging, not crates.io —
# this crate-type is cdylib-only and meaningless as a Rust library
# dependency.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
redact-paperasse-core = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[features]
default = ["console_error_panic_hook"]
